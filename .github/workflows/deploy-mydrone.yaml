# mydrone.uz saytini serverga chiqaradi.
#
# Nega bu workflow shu repoda turibdi: serverga kiruvchi deploy kaliti
# (SSH_PRIVATE_KEY) shu repo secret'larida saqlanadi. mydrone repo'si ochiq,
# shuning uchun kod serverga to'g'ridan-to'g'ri GitHub'dan klonlanadi.
#
# Faqat qo'lda ishga tushiriladi: Actions -> "Deploy mydrone.uz" -> Run workflow
# (yoki: gh workflow run deploy-mydrone.yaml -R alfastarsx-web/myteacher-office)

name: Deploy mydrone.uz

on:
  workflow_dispatch:

concurrency:
  group: deploy-mydrone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Serverda deploy
        env:
          MYDRONE_ADMIN_PASS: ${{ secrets.MYDRONE_ADMIN_PASS }}
        run: |
          # Deploy mantig'i mydrone repo'sining o'zida (deploy/remote-deploy.sh).
          # Shu sababli bu workflow'ni o'zgartirmasdan turib ham tuzatish mumkin.
          cat > /tmp/remote.sh <<'REMOTE'
          set -euo pipefail
          REPO=https://github.com/alfastarsx-web/mydrone.git
          SRC=/opt/mydrone-src

          echo "== Kod yuklanmoqda =="
          if [ -d "$SRC/.git" ]; then
            git -C "$SRC" fetch --depth 1 origin main
            git -C "$SRC" reset --hard origin/main
          else
            rm -rf "$SRC"
            git clone --depth 1 "$REPO" "$SRC"
          fi
          echo "  commit: $(git -C "$SRC" rev-parse --short HEAD)"

          cd "$SRC"
          bash deploy/remote-deploy.sh
          REMOTE

          # Admin paroli secret'dan olinadi va skriptning boshiga qo'shiladi.
          # GitHub uni logda avtomatik *** qilib yashiradi.
          if [ -n "${MYDRONE_ADMIN_PASS:-}" ]; then
            printf 'export ADMIN_PASS=%q\n' "$MYDRONE_ADMIN_PASS" > /tmp/remote-full.sh
          else
            : > /tmp/remote-full.sh
          fi
          cat /tmp/remote.sh >> /tmp/remote-full.sh

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
            root@"${{ secrets.SSH_HOST }}" 'bash -s' < /tmp/remote-full.sh

      - name: Tekshirish
        run: |
          fail=0
          chk() {
            code=$(curl -so /dev/null -w '%{http_code}' -m 20 "$2")
            if [ "$code" = "$3" ]; then
              echo "  OK  $1 -> $code"
            else
              echo "  XATO $1 -> $code (kutilgan $3)"
              fail=1
            fi
          }
          chk "bosh sahifa"       https://mydrone.uz/                       200
          chk "ichki manzil"      https://mydrone.uz/mahsulot/dji-avata-2   200
          chk "katalog"           https://mydrone.uz/katalog                200
          chk "sitemap.xml"       https://mydrone.uz/sitemap.xml            200
          chk "robots.txt"        https://mydrone.uz/robots.txt             200
          chk "admin (parolsiz)"  https://mydrone.uz/admin.html             401
          chk "API"               https://mydrone.uz/api/settings           200
          echo -n "  katalog API: "
          curl -s -m 20 "https://mydrone.uz/api/products?limit=1" | head -c 60; echo
          echo -n "  gzip: "
          if curl -sI -H 'Accept-Encoding: gzip' -m 20 https://mydrone.uz/assets/js/app.js | grep -i content-encoding; then
            :
          else
            echo "yo'q"
            fail=1
          fi
          exit $fail
