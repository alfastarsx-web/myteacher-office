on:
  push:
    branches:
      - main
    # Faqat workflow fayllari o'zgarganda CRM'ni qayta deploy qilish shart emas
    # (pm2 restart bo'lib, API bir necha soniya uzilib qoladi).
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          HOST="${{ secrets.SSH_HOST }}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"

          # Serverda bajariladigan buyruqlar (idempotent — qayta ishga tushirsa ham xavfsiz)
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -e
          source ~/.nvm/nvm.sh 2>/dev/null || true
          source ~/.profile 2>/dev/null || true
          cd /var/www/mycrm
          git pull
          cd backend
          npm i -f
          npm run build
          pm2 restart mycrm-api
          REMOTE

          # SSH ulanishi vaqti-vaqti bilan uzilib turadi (exit 255). Faqat ulanish
          # xatolarida qayta urinamiz; remote buyruq xatosida (build va h.k.) darrov to'xtaymiz.
          max=5
          attempt=0
          while :; do
            attempt=$((attempt+1))
            echo "::group::Deploy urinish $attempt/$max"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            set +e +o pipefail
            ssh $SSH_OPTS root@"$HOST" 'bash -s' < /tmp/remote-deploy.sh 2>&1 | tee /tmp/ssh-out.log
            code=${PIPESTATUS[0]}
            set -e -o pipefail
            echo "::endgroup::"

            if [ "$code" -eq 0 ]; then
              echo "Deploy muvaffaqiyatli ($attempt-urinishda)."
              exit 0
            fi

            # Autentifikatsiya xatosi (deploy kaliti serverda ishlamayapti) ham exit 255 beradi,
            # lekin qayta urinish foydasiz — kalit tuzatilmaguncha hech qachon o'tmaydi. Darrov to'xtaymiz.
            if grep -qiE "Permission denied|Too many authentication failures|publickey" /tmp/ssh-out.log; then
              echo "SSH AUTENTIFIKATSIYA xatosi — deploy kaliti serverda ishlamayapti."
              echo "SSH_PRIVATE_KEY secret'ining public jufti serverda root ~/.ssh/authorized_keys da bo'lishi kerak (SSH_HOST ham to'g'ri bo'lsin). Qayta urinilmaydi."
              exit "$code"
            fi

            if [ "$code" -ne 255 ]; then
              echo "Remote buyruq xatosi (exit $code) — bu ulanish muammosi emas, to'xtatildi."
              exit "$code"
            fi

            if [ "$attempt" -ge "$max" ]; then
              echo "SSH ulanishi $max marta uzildi (exit 255). Deploy bajarilmadi."
              exit 1
            fi

            wait_s=$((attempt*10))
            echo "SSH ulanishi uzildi (exit 255). ${wait_s}s dan keyin qayta uriniladi..."
            sleep "$wait_s"
          done
