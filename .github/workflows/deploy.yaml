on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          ssh root@${{ secrets.SSH_HOST }} 'bash -se' << 'EOF'
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            cd /var/www/mycrm
            git fetch origin main
            git reset --hard origin/main

            for webroot in /var/www/html /usr/share/nginx/html /var/www/office /var/www/myteacher-office; do
              if [ -d "$webroot" ]; then
                cp -f /var/www/mycrm/index.html "$webroot/index.html"
                cp -f /var/www/mycrm/deal-import-template.csv "$webroot/deal-import-template.csv" 2>/dev/null || true
                mkdir -p "$webroot/assets"
                cp -R /var/www/mycrm/assets/. "$webroot/assets/"
              fi
            done

            set +e
            for searchroot in /var/www /usr/share/nginx/html; do
              [ -d "$searchroot" ] || continue
              while IFS= read -r page; do
                grep -q 'MyTeacher Office' "$page" || continue
                webroot="$(dirname "$page")"
                cp -f /var/www/mycrm/index.html "$page"
                cp -f /var/www/mycrm/deal-import-template.csv "$webroot/deal-import-template.csv" 2>/dev/null || true
                mkdir -p "$webroot/assets"
                cp -R /var/www/mycrm/assets/. "$webroot/assets/"
              done < <(find "$searchroot" -maxdepth 5 -type f -name index.html 2>/dev/null)
            done
            set -e

            cd /var/www/mycrm/backend
            npm ci
            npm run build

            if pm2 describe mycrm-api >/dev/null 2>&1; then
              pm2 restart mycrm-api --update-env
            else
              pm2 start dist/main.js --name mycrm-api --update-env
            fi
            pm2 save
          EOF
